services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      # Loopback-only by default. A physical ESP32 needs MQTT_BIND_IP set to
      # 0.0.0.0 (or this machine's LAN IP) in .env, then connect to
      # <laptop LAN IPv4>:MQTT_PORT. Never expose 1883 publicly.
      - "${MQTT_BIND_IP:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 5 -v | grep -q uptime"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
  frontend:
    image: rbrick-frontend:local
    build:
      context: ./Frontend
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-8088}:80"
    environment:
      API_UPSTREAM: "${API_UPSTREAM:-http://backend:5000}"
      NGINX_ENVSUBST_FILTER: "^API_UPSTREAM$$"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  backend:
    image: rbrick-backend:local
    build:
      context: ./backend
    # Mosquitto may still be starting; the backend retries MQTT with backoff.
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGODB_URI: "${MONGODB_URI:-}"
      MONGODB_TLS: '${MONGODB_TLS:-true}'
      DB_NAME: "${DB_NAME:-building_safety}"
      IOT_API_TOKEN: "${IOT_API_TOKEN:-}"
      MQTT_ENABLED: "${MQTT_ENABLED:-false}"
      # Inside compose the broker is reached by service name, never localhost.
      MQTT_URL: "${MQTT_URL:-mqtt://mosquitto:1883}"
      MQTT_USERNAME: "${MQTT_USERNAME:-}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:-}"
      MQTT_CLIENT_ID: "${MQTT_CLIENT_ID:-resiliox-backend-subscriber}"
      MQTT_TOPIC: "${MQTT_TOPIC:-}"
      # rbrick-v1 = nested schema from IoT firmware/simulator (default).
      # flat = legacy env-configured flat contract below.
      MQTT_PAYLOAD_FORMAT: "${MQTT_PAYLOAD_FORMAT:-rbrick-v1}"
      DEVICE_ID_FIELD: "${DEVICE_ID_FIELD:-deviceId}"
      EVENT_ID_FIELD: "${EVENT_ID_FIELD:-eventId}"
      TIMESTAMP_FIELD: "${TIMESTAMP_FIELD:-timestamp}"
      SENSOR_FIELDS_JSON: '${SENSOR_FIELDS_JSON:-{}}'
      ALERT_RULES_JSON: '${ALERT_RULES_JSON:-[]}'
      SENSOR_DISPLAY_JSON: '${SENSOR_DISPLAY_JSON:-{}}'
      DEVICE_OFFLINE_AFTER_SECONDS: '${DEVICE_OFFLINE_AFTER_SECONDS:-120}'
      # Risk engine overrides; empty uses documented demo defaults.
      RISK_THRESHOLDS_JSON: '${RISK_THRESHOLDS_JSON:-{}}'
      AI_SERVICE_URL: '${AI_SERVICE_URL:-http://ai_ml:8000}'
      AI_TIMEOUT_MS: '${AI_TIMEOUT_MS:-3000}'
      AI_SERVICE_TOKEN: '${AI_SERVICE_TOKEN:-}'
      # Socket.IO CORS origins (comma-separated); empty = same-origin only.
      SOCKET_CORS_ORIGIN: "${SOCKET_CORS_ORIGIN:-}"
      # ESP32-CAM snapshot endpoints, e.g. {"esp32_cam_01":"http://192.168.1.20:81/snapshot"}.
      CAMERA_SNAPSHOT_URLS_JSON: '${CAMERA_SNAPSHOT_URLS_JSON:-{}}'
      CAMERA_SOURCES_JSON: '${CAMERA_SOURCES_JSON:-{}}'
      CAMERA_BEARER_TOKENS_JSON: '${CAMERA_BEARER_TOKENS_JSON:-{}}'
    depends_on:
      mosquitto:
        condition: service_started
      ai_ml:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  ai_ml:
    image: rbrick-ai-ml:local
    build:
      context: ./ai_ml
    environment:
      RISK_THRESHOLDS_JSON: '${RISK_THRESHOLDS_JSON:-{}}'
      AI_SERVICE_TOKEN: '${AI_SERVICE_TOKEN:-}'
    restart: unless-stopped
    init: true
    # Internal Compose network only; no public AI service port.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mosquitto-data: {}
