# RBrick MQTT broker configuration (Eclipse Mosquitto 2.x)
#
# DEMO CONFIGURATION. The listener allows anonymous access and is intended for
# hackathon use on loopback or a trusted LAN/hotspot only. For any non-demo
# deployment: set `allow_anonymous false`, create a password file with
# `mosquitto_passwd`, and see acl.example for topic access control. Never expose
# port 1883 to the public internet.

listener 1883 0.0.0.0
allow_anonymous true

# Persistent storage for retained messages / queued QoS 1 sessions.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
autosave_on_changes false

# Bounded message and packet sizes (telemetry payloads are small JSON).
max_packet_size 65536
message_size_limit 0

# Logging to stdout so `docker compose logs mosquitto` shows broker activity.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Publishes $SYS topics (used by the compose healthcheck and diagnostics).
sys_interval 10
