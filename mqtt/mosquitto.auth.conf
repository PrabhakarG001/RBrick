# Authenticated LAN/development profile; demo configuration remains unchanged.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/secrets/password_file
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_packet_size 65536
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
sys_interval 10
